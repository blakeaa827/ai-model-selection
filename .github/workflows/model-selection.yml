name: AI Model Selection
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - '.github/workflows/model-selection.yml'
permissions:
  contents: write
concurrency:
  group: model-selection-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema validator
        run: python3 -m pip install --quiet --target run-artifacts/validation-deps jsonschema==4.25.1
      - name: Acquire, validate and atomically publish the current report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_PARENT_SHA: ${{ github.sha }}
        run: node pipeline/refresh.mjs --publish
      - name: Retain stage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-selection-diagnostics
          path: |
            run-artifacts/refresh-status.json
            run-artifacts/validation.json
            run-artifacts/publication.json
            run-artifacts/workload-diagnostics.json
          if-no-files-found: ignore
