name: Model selection diagnostics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source connectivity preflight
        id: sources
        continue-on-error: true
        run: node pipeline/preflight.mjs
      - name: Official AA catalog acquisition
        id: aa_catalog
        continue-on-error: true
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: node pipeline/aa-catalog.mjs
      - name: Frontier regression
        id: frontier
        continue-on-error: true
        run: node pipeline/test-frontier.mjs
      - name: Coordinator regression
        id: coordinator
        continue-on-error: true
        run: node pipeline/test-run.mjs
      - name: Store diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-selection-diagnostics
          path: run-artifacts/
          if-no-files-found: ignore
      - name: Enforce overall result
        if: always()
        env:
          SOURCE_RESULT: ${{ steps.sources.outcome }}
          AA_RESULT: ${{ steps.aa_catalog.outcome }}
          FRONTIER_RESULT: ${{ steps.frontier.outcome }}
          COORDINATOR_RESULT: ${{ steps.coordinator.outcome }}
        run: |
          echo "Source: $SOURCE_RESULT"
          echo "AA API: $AA_RESULT"
          echo "Frontier: $FRONTIER_RESULT"
          echo "Coordinator: $COORDINATOR_RESULT"
          test "$SOURCE_RESULT" = success
          test "$AA_RESULT" = success
          test "$FRONTIER_RESULT" = success
          test "$COORDINATOR_RESULT" = success
