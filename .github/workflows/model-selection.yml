name: Model-selection pipeline diagnostics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Network and source preflight
        run: node pipeline/preflight.mjs
      - name: Frontier regression tests
        if: always()
        run: node pipeline/test-frontier.mjs
      - name: Coordinator regression tests
        if: always()
        run: node pipeline/test-run.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-selection-diagnostics
          path: run-artifacts/
          if-no-files-found: ignore
